<head>

<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a227;--cream:#f9f5ea;--sand:#f1e6c8;--sand2:#e9dba9;--wine:#5e1a33;--navy:#101f3d;--ink:#2b2418;--mute:#7a6f5a;--line:#eadfc0;--card:#fff;--ok:#3f6b1f;--bad:#8a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--cream:#1c1810;--sand:#2a2416;--sand2:#3a3120;--ink:#f3ead3;--mute:#b3a688;--line:#3a3120;--card:#241f14;--navy:#f3ead3}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Readex Pro',Tahoma,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:14px}
a{color:inherit;text-decoration:none;cursor:pointer}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{background:var(--gold);color:#2b2418;display:flex;justify-content:center;gap:40px;padding:8px;font-size:12px;flex-wrap:wrap}
.hd{background:var(--card);display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo b{font-size:22px;font-weight:500;display:block;line-height:1}.logo small{font-size:9px;letter-spacing:3px;color:var(--mute)}
.crown{width:48px;height:48px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:22px;background:var(--sand)}
.search{flex:1;min-width:160px;max-width:420px;background:var(--sand);border-radius:99px;padding:10px 16px;display:flex;gap:8px;align-items:center}.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.hl{display:flex;gap:16px;font-size:12px;align-items:center;margin-inline-start:auto}.hl a{display:flex;gap:5px;align-items:center}
.nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:26px;padding:0 24px;overflow-x:auto;font-size:13px}
.nav a{padding:13px 0;border-bottom:2px solid transparent;white-space:nowrap}.nav a.on{color:var(--wine);border-color:var(--gold)}
main{max-width:1200px;margin:auto;padding:24px}
.hero{background:var(--wine);color:#fff;border-radius:24px;display:flex;align-items:center;justify-content:space-between;padding:40px 48px;gap:24px;min-height:290px;overflow:hidden}
.hero .tag{background:var(--sand);color:var(--wine);border-radius:6px;padding:3px 10px;font-size:11px;display:inline-block}
.hero h1{font-size:46px;font-weight:400;line-height:1.35;margin:14px 0 10px}.hero p{opacity:.85;font-size:13px}
.hero .art{position:relative;width:260px;height:230px;flex:none}.hero .big{position:absolute;inset:0 30px 0 0;background:var(--sand);border-radius:50%;display:grid;place-items:center;color:var(--navy);font-size:90px}
.hero .dot{position:absolute;width:76px;height:76px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 22px;border-radius:10px;font-weight:500;background:var(--gold);color:#2b2418;border:1px solid var(--gold)}
.btn.w{background:#fff;border-color:#fff;color:var(--navy)}.btn.o{background:var(--card);border-color:var(--navy);color:var(--ink)}.btn.full{width:100%}
h2.t{font-size:19px;font-weight:500;margin:34px 0 16px;display:flex;justify-content:space-between;align-items:baseline}h2.t a{font-size:12px;color:var(--mute);font-weight:300}
.cats{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}.cat{text-align:center;font-size:12px}.cat i{width:66px;height:66px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 8px;font-size:26px;color:var(--navy);font-style:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.pc .im{height:116px;background:var(--sand);display:grid;place-items:center;font-size:44px;color:var(--navy)}
.pc .heart{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:14px}
.pc .bd{position:absolute;top:10px;left:10px;background:var(--wine);color:#fff;border-radius:5px;font-size:10px;padding:2px 8px}
.pc .in{padding:12px}.pc h4{font-weight:500;font-size:13px}.pc small{color:var(--mute);font-size:11px}
.pc .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pc .add{width:30px;height:30px;border-radius:8px;background:var(--gold);display:grid;place-items:center;color:#2b2418}
.pr b{font-weight:500}.pr s{font-size:10px;color:var(--mute);margin-inline-end:5px}
.bn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.bn div{border-radius:18px;padding:26px 30px;display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line)}

.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}.perks div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center}.perks svg{font-size:24px}.perks b{font-weight:500;display:block;font-size:13px}.perks small{color:var(--mute);font-size:11px}
footer{background:var(--sand);margin-top:40px;padding:32px 24px 16px}.fg{max-width:1200px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:24px}

.stores{display:flex;gap:8px;margin-bottom:12px}.stores span{border:1px solid var(--navy);border-radius:8px;padding:7px 12px;font-size:12px;background:var(--card)}
.cp{max-width:1200px;margin:22px auto 0;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.crumb{font-size:11px;color:var(--mute);margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pd .ph{background:var(--sand);border-radius:16px;height:410px;display:grid;place-items:center;font-size:150px;color:var(--navy);position:relative}

.th{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}.th div{background:var(--sand);border-radius:12px;height:84px;display:grid;place-items:center;font-size:30px;color:var(--navy);border:1.5px solid transparent;cursor:pointer}.th .on{border-color:var(--gold)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 18px}.chip{border:1px solid var(--line);border-radius:10px;padding:9px 22px;background:var(--card)}.chip.on{background:var(--sand);border-color:var(--gold)}

.range{height:4px;background:var(--sand);border-radius:9px;margin:16px 0 8px;position:relative}.range i{position:absolute;inset:0 25% 0 30%;background:var(--gold);border-radius:9px}
.pg{display:flex;gap:8px;justify-content:center;margin-top:24px}.pg button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.pg .on{background:var(--gold);border-color:var(--gold)}
.steps{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:20px}.steps b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);font-weight:500}.steps b.no{background:var(--card);border:1px solid var(--line)}.steps hr{width:80px;border:0;border-top:1px solid var(--line)}
.co{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}.stack>*+*{margin-top:16px}
.ci{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.ci .im{width:80px;height:80px;background:var(--sand);border-radius:12px;display:grid;place-items:center;font-size:32px;color:var(--navy)}.ci .nm{flex:1}
.ci .del{color:var(--wine)}.sm{display:flex;justify-content:space-between;margin:12px 0;font-size:13px;color:var(--mute)}.sm.g{color:var(--ok)}.sm.t{color:var(--ink);font-size:17px;font-weight:500;border-top:1px solid var(--line);padding-top:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fld label{display:block;font-size:12px;color:var(--mute);margin:12px 0 6px}
.fld input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:0}.fld input:focus{border-color:var(--gold)}
.opt{display:flex;gap:12px;margin:12px 0}.opt label{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--card)}.opt label:has(input:checked){background:var(--sand);border-color:var(--gold)}.opt input{accent-color:var(--gold)}.opt small{display:block;color:var(--mute);font-size:11px}
.au{display:grid;grid-template-columns:1fr 1fr;gap:36px;max-width:1000px;margin:20px auto}.au h2{font-weight:500;font-size:24px;display:flex;align-items:center;gap:12px;margin-bottom:6px}.au h2 i{background:var(--sand2);width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px}
.au p.s{color:var(--mute);font-size:13px;margin-bottom:8px}.soc{display:flex;gap:12px;margin-top:14px}.soc .btn{flex:1}.or{text-align:center;color:var(--mute);font-size:12px;margin:16px 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 20px;border-radius:10px;font-size:13px;z-index:9}
/* admin */
.ad{display:grid;grid-template-columns:1fr 210px;min-height:100vh;background:var(--cream)}.sb{background:var(--card);border-inline-start:1px solid var(--line);padding:24px 14px;order:2}.sb h3{font-weight:500;font-size:22px;padding:0 10px 20px}
.sb a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:10px;color:var(--mute);margin-bottom:4px}.sb a.on{background:var(--sand2);color:var(--ink);box-shadow:inset -3px 0 var(--wine)}
.am{padding:24px;order:1}.am .hd2{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.am h1{font-size:19px;font-weight:500}.am .hd2 p{color:var(--mute);font-size:12px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.kp .box{padding:16px}.kp small{color:var(--mute);display:flex;justify-content:space-between}.kp b{display:block;font-size:26px;font-weight:400;margin:8px 0 4px}.up{color:var(--ok);font-size:12px}.dn{color:var(--bad);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;margin-bottom:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.am h4{font-weight:500;font-size:15px;margin-bottom:14px}
.bar{margin:14px 0}.bar div{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.bar i{display:block;height:6px;background:var(--sand);border-radius:9px;position:relative;overflow:hidden}.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--gold);border-radius:9px}
.li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.li:last-child{border:0}.li span{color:var(--mute)}
table{width:100%;border-collapse:collapse}th{color:var(--mute);font-weight:400;text-align:right;padding:10px 8px;font-size:12px}td{padding:13px 8px;border-top:1px solid var(--line);font-size:13px}
.st{padding:3px 12px;border-radius:99px;font-size:11px;display:inline-block}.s0{background:var(--sand2)}.s1{background:#fbe9cf;color:#7a4b10}.s2{background:#f8dde4;color:#8a1f3f}.s3{background:#e2f0d4;color:#2f5a14}.s4{background:#f8dcdc;color:#8a2a2a}
.fl{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.fl button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 20px}.fl .on{background:var(--gold);border-color:var(--gold)}
.chart{display:flex;align-items:flex-end;gap:12px;height:140px;border-bottom:1px solid var(--line);padding-top:8px}.chart div{flex:1;background:var(--sand);border-radius:5px 5px 0 0}.chart .h{background:var(--gold)}
.xl{display:flex;gap:12px;font-size:11px;color:var(--mute);margin-top:6px}.xl span{flex:1;text-align:center}
.pill{padding:3px 12px;border-radius:99px;font-size:11px;background:#fbe9cf}
@media(max-width:860px){.hero{padding:26px}.hero .art{display:none}.hero h1{font-size:32px}.pd,.lay,.co,.au,.bn,.two,.three{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.ad{grid-template-columns:1fr}.sb{order:0;display:flex;overflow-x:auto;padding:10px}.sb h3{display:none}.kp{grid-template-columns:1fr 1fr}.hl{margin:0}.f2{grid-template-columns:1fr}}
</style>
</head>

 d="M3 9 5 4h14l2 5v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM5 13v8h14v-8"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>',grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',bag:'<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6zM9 8a3 3 0 0 1 6 0"/></svg>',users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 0 1 0 6M22 20c0-3-2-5-4-5"/></svg>',box:'<svg viewBox="0 0 24 24"><path d="m12 3 8 4v10l-8 4-8-4V7zM4 7l8 4 8-4M12 11v10"/></svg>',bars:'<svg viewBox="0 0 24 24"><path d="M4 21V10h4v11M10 21V4h4v17M16 21v-8h4v8"/></svg>',gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',dl:'<svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'};
const P=[
{id:1,n:'كنافة بالقشطة',u:'الكيلو',p:180,i:'cookie',b:'جديد',c:'شرقي'},
{id:2,n:'جاتوه الشوكولاتة',u:'قطعة كاملة',p:320,i:'cake',c:'غربي'},
{id:3,n:'بقلاوة مشكلة',u:'الكيلو',p:250,o:280,i:'cookie',b:'خصم 10%',c:'شرقي'},
{id:4,n:'صندوق هدايا ملكي',u:'علبة',p:450,i:'gift',c:'هدايا'},
{id:5,n:'ميني بيتي فور',u:'500 جم',p:140,i:'cake',c:'غربي'},
{id:6,n:'بسبوسة بالمكسرات',u:'الكيلو',p:160,i:'cookie',c:'شرقي'},
{id:7,n:'أم علي بالمكسرات',u:'طبق فردي',p:65,i:'cake',b:'الأكثر مبيعًا',c:'شرقي'},
{id:8,n:'كحك بالعجوة',u:'الكيلو',p:210,i:'cookie',c:'شرقي'},
{id:9,n:'بريوش بالشوكولاتة',u:'قطعة',p:25,i:'bread',c:'مخبوزات'},
{id:10,n:'أيس كريم مانجو',u:'لتر',p:95,i:'ice',c:'أيس كريم'}];
